name: CI

# Runners: GitHub-hosted by default
# To use Blacksmith: set repo variable USE_BLACKSMITH=true

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

defaults:
  run:
    working-directory: qcut

jobs:
  lint:
    name: Lint
    runs-on: ${{ vars.USE_BLACKSMITH == 'true' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.10-${{ hashFiles('qcut/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.10-

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint:clean

      - name: Check Electron boundaries
        run: bun scripts/check-boundaries.ts --no-file-size

      - name: Check circular dependencies
        run: bun run check:circular

      - name: Type check
        run: bun run check-types

  build:
    needs: lint
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ${{ vars.USE_BLACKSMITH == 'true' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
            os: ubuntu
          - runner: ${{ vars.USE_BLACKSMITH == 'true' && 'blacksmith-4vcpu-windows-2025' || 'windows-latest' }}
            os: windows
          - runner: macos-latest
            os: macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.10-${{ hashFiles('qcut/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.10-

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Run tests with coverage
        run: bun run test -- --coverage
        continue-on-error: true

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu'
        uses: codecov/codecov-action@v5
        with:
          files: qcut/apps/web/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
