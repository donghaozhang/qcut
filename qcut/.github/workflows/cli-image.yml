name: CLI Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish, e.g. v0.1.0 or dev-2026-05-14"
        required: true
        type: string
      platforms:
        description: "Build platforms"
        required: false
        default: "linux/amd64"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build, Smoke, And Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare image names
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          fi
          echo "name=ghcr.io/${owner}/qcut-cli" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build local smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cli
          platforms: linux/amd64
          load: true
          tags: qcut-cli:ci
          build-args: |
            QCUT_VERSION=${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke qcut-cli image
        run: docker run --rm qcut-cli:ci qcut-smoke

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cli
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest
          build-args: |
            QCUT_VERSION=${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
