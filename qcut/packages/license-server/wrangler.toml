name = "qcut-license-server"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "70804d32fc714532a36dd1a0620da9ae"

[vars]
ENVIRONMENT = "production"
PAYMENTS_WEB_BASE_URL = "https://quriosity.com.au"
PAYMENTS_CHECKOUT_ENABLED = "true"
PAYMENTS_WEBHOOK_ENABLED = "true"
PAYMENTS_CANARY_ONLY = "false"
CORS_ALLOWED_ORIGINS = ""
AI_PROXY_RATE_LIMIT = "60"
QCUT_AGENT_ALLOW_DEFAULT_USER = "true"
# Pinned to immutable digest so retags can't silently change sandbox runtime.
# Human-readable tag: cli-image-v12-ref2v-20260526205824
QCUT_IMAGE_TAG = "ghcr.io/quriosity-agent/qcut-cli@sha256:ff56c1087655b6e1893dc44766a4a9a6e3ae156e6b625f77871624a9fbe79cf6"

# AI provider keys are stored as Wrangler secrets (not vars):
# wrangler secret put FAL_API_KEY
# wrangler secret put GEMINI_API_KEY
# wrangler secret put OPENROUTER_API_KEY
# wrangler secret put ELEVENLABS_API_KEY
# wrangler secret put GMI_API_KEY
# wrangler secret put RUNWAY_API_KEY
# wrangler secret put FREESOUND_API_KEY
# wrangler secret put IMAROUTER_API_KEY
# wrangler secret put ADMIN_API_KEY
