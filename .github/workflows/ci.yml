name: CI

# Runners: GitHub-hosted by default
# To use Blacksmith: set repo variable USE_BLACKSMITH=true

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    working-directory: qcut

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ${{ vars.USE_BLACKSMITH == 'true' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
            os: ubuntu
            ffmpeg_targets: linux-x64
          - runner: ${{ vars.USE_BLACKSMITH == 'true' && 'blacksmith-4vcpu-windows-2025' || 'windows-latest' }}
            os: windows
            ffmpeg_targets: win32-x64
          - runner: macos-latest
            os: macos
            ffmpeg_targets: darwin-arm64,darwin-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache Bun modules
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.10-${{ hashFiles('qcut/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.10-

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint:clean

      - name: Type check
        run: bun run check-types

      - name: Build
        run: bun run build
        env:
          FFMPEG_STAGE_TARGETS: ${{ matrix.ffmpeg_targets }}

      - name: Run tests with coverage
        run: cd apps/web && bunx vitest run --coverage
        continue-on-error: true

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu'
        uses: codecov/codecov-action@v5
        with:
          files: qcut/apps/web/coverage/lcov.info
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
