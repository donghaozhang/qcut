name: Release

# Runners: GitHub-hosted by default
# To use Blacksmith: set repo variable USE_BLACKSMITH=true
# To use self-hosted Mac: set repo variable USE_SELF_HOSTED_MAC=true

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    working-directory: qcut

jobs:
  # Extract version info once, share across jobs
  prepare:
    runs-on: ${{ vars.USE_BLACKSMITH == 'true' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      is_prerelease: ${{ steps.version.outputs.IS_PRERELEASE }}
      channel: ${{ steps.version.outputs.CHANNEL }}
    steps:
      - name: Extract version info
        id: version
        working-directory: .
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

          if [[ "$VERSION" =~ -alpha|-beta|-rc ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          fi

          if [[ "$VERSION" =~ -alpha ]]; then
            echo "CHANNEL=alpha" >> $GITHUB_OUTPUT
          elif [[ "$VERSION" =~ -beta ]]; then
            echo "CHANNEL=beta" >> $GITHUB_OUTPUT
          elif [[ "$VERSION" =~ -rc ]]; then
            echo "CHANNEL=rc" >> $GITHUB_OUTPUT
          else
            echo "CHANNEL=latest" >> $GITHUB_OUTPUT
          fi

          echo "Detected: VERSION=$VERSION"

  # Windows build
  build-windows:
    needs: prepare
    runs-on: windows-latest
    env:
      FFMPEG_STAGE_TARGETS: win32-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.10-${{ hashFiles('qcut/bun.lock', 'qcut/apps/web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.10-

      - name: Install dependencies
        run: bun install

      - name: Generate route tree
        run: cd apps/web && bunx --bun @tanstack/router-cli generate

      - name: Build web application
        run: bun run build

      - name: Build Electron scripts
        run: bun run build:electron

      - name: Build afterPack script
        run: cd scripts && bunx tsc

      - name: Build Electron application
        run: |
          npx electron-builder --win --publish never --config.win.forceCodeSigning=false --config.win.verifyUpdateCodeSignature=false --config.publish.channel=${{ needs.prepare.outputs.channel }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            qcut/dist-electron/QCut*Setup*.exe
            qcut/dist-electron/latest.yml
            !qcut/dist-electron/builder-debug.yml
          if-no-files-found: error

  # macOS build
  build-macos:
    needs: prepare
    runs-on: ${{ vars.USE_SELF_HOSTED_MAC == 'true' && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'macos-latest' }}
    env:
      FFMPEG_STAGE_TARGETS: darwin-arm64,darwin-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean previous build artifacts
        if: ${{ vars.USE_SELF_HOSTED_MAC == 'true' }}
        run: |
          rm -rf dist-electron dist apps/web/dist
          git clean -fdx -e node_modules -e .bun

      - name: Install Bun
        if: ${{ vars.USE_SELF_HOSTED_MAC != 'true' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Verify Bun (self-hosted)
        if: ${{ vars.USE_SELF_HOSTED_MAC == 'true' }}
        run: |
          echo "Bun: $(bun --version)"
          echo "Node: $(node --version)"

      - name: Cache Bun modules
        if: ${{ vars.USE_SELF_HOSTED_MAC != 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.10-${{ hashFiles('qcut/bun.lock', 'qcut/apps/web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.10-

      - name: Install dependencies
        run: bun install

      - name: Generate route tree
        run: cd apps/web && bunx @tanstack/router-cli generate

      - name: Build web application
        run: bun run build

      - name: Build Electron scripts
        run: bun run build:electron

      - name: Build afterPack script
        run: cd scripts && bunx tsc

      - name: Cache Electron binary
        if: ${{ vars.USE_SELF_HOSTED_MAC != 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('qcut/node_modules/electron/package.json') }}

      - name: Build Electron application
        run: |
          rm -rf dist-electron
          echo "::group::Electron Builder"
          time npx electron-builder --mac --publish never --config.publish.channel=${{ needs.prepare.outputs.channel }}
          echo "::endgroup::"
          ls -lah dist-electron/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_HARD_LINKS: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            qcut/dist-electron/*.dmg
            qcut/dist-electron/*.zip
            qcut/dist-electron/latest-mac.yml
            !qcut/dist-electron/builder-debug.yml
          if-no-files-found: error

  # Linux build
  build-linux:
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      FFMPEG_STAGE_TARGETS: linux-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Node
        run: node -v

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.10-${{ hashFiles('qcut/bun.lock', 'qcut/apps/web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.10-

      - name: Install dependencies
        run: bun install

      - name: Generate route tree
        run: cd apps/web && bunx --bun @tanstack/router-cli generate

      - name: Build web application
        run: bun run build

      - name: Build Electron scripts
        run: bun run build:electron

      - name: Build afterPack script
        run: cd scripts && bunx tsc

      - name: Generate Linux icons
        run: |
          set -euo pipefail
          mkdir -p build/icons
          if [ -f build/icon.png ]; then
            cp build/icon.png build/icons/256x256.png
            cp build/icon.png build/icons/512x512.png
          elif [ -f build/icon.ico ] && command -v python3 >/dev/null 2>&1; then
            python3 -m pip install --user --quiet pillow
            python3 -c "from PIL import Image; from pathlib import Path; icon_dir = Path('build/icons'); icon_dir.mkdir(parents=True, exist_ok=True); img = Image.open('build/icon.ico'); resample = getattr(Image, 'Resampling', Image).LANCZOS; img.resize((256, 256), resample).save(icon_dir / '256x256.png'); img.resize((512, 512), resample).save(icon_dir / '512x512.png')"
          elif command -v convert >/dev/null 2>&1; then
            convert "build/icon.ico[0]" -resize 256x256 build/icons/256x256.png
            convert "build/icon.ico[0]" -resize 512x512 build/icons/512x512.png
          elif command -v magick >/dev/null 2>&1; then
            magick convert "build/icon.ico[0]" -resize 256x256 build/icons/256x256.png
            magick convert "build/icon.ico[0]" -resize 512x512 build/icons/512x512.png
          else
            echo "No supported icon source/tool found (need build/icon.png, python3+pillow, or ImageMagick)"
            exit 1
          fi

      - name: Build Electron application
        run: |
          npx electron-builder --linux --publish never --config.publish.channel=${{ needs.prepare.outputs.channel }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            qcut/dist-electron/*.AppImage
            qcut/dist-electron/*.deb
            qcut/dist-electron/latest-linux.yml
            !qcut/dist-electron/builder-debug.yml
          if-no-files-found: error

  # Create release with all artifacts
  release:
    needs: [prepare, build-windows, build-macos, build-linux]
    runs-on: ${{ vars.USE_BLACKSMITH == 'true' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        working-directory: .
        run: find artifacts -type f | head -50

      - name: Generate checksums
        working-directory: .
        run: |
          cd artifacts
          find . -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" \) -exec sha256sum {} \; > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: QCut v${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.is_prerelease == 'false' }}
          generate_release_notes: true
          files: |
            artifacts/windows-build/QCut*Setup*.exe
            artifacts/windows-build/latest.yml
            artifacts/macos-build/*.dmg
            artifacts/macos-build/*.zip
            artifacts/macos-build/latest-mac.yml
            artifacts/linux-build/*.AppImage
            artifacts/linux-build/*.deb
            artifacts/linux-build/latest-linux.yml
            artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
