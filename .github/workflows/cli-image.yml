name: cli-image

# Builds the qcut-cli Docker image (Dockerfile.cli) and pushes it to
# GitHub Container Registry. The image is consumed by:
#   - .devcontainer/devcontainer.json (Daytona dev workspaces)
#   - packages/agent-worker run-on-daytona path (DAYTONA_API_KEY)
#   - packages/license-server /api/sandbox/spawn (when QCUT_IMAGE_TAG
#     points here — note: E2B uses its own template system, see
#     docs/task/daytona-supabase-agent/implementation/ACTUAL.md for
#     the E2B-specific build path)
#
# Triggers:
#   - workflow_dispatch (manual; pick a tag)
#   - push of a tag matching v* (release publishes :latest + :vX.Y.Z)
#
# Required secrets:
#   GITHUB_TOKEN is provided automatically and has packages: write
#     when permissions block below is set.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g., v0.3.2 or dev-2026-05-14)'
        required: true
        default: 'dev'
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: qcut

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve tag
        id: tag
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: qcut
          file: qcut/Dockerfile.cli
          push: true
          tags: |
            ghcr.io/${{ steps.tag.outputs.owner }}/qcut-cli:${{ steps.tag.outputs.value }}
            ghcr.io/${{ steps.tag.outputs.owner }}/qcut-cli:latest
          build-args: |
            QCUT_VERSION=${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test pushed image
        run: |
          docker run --rm \
            ghcr.io/${{ steps.tag.outputs.owner }}/qcut-cli:${{ steps.tag.outputs.value }} \
            qcut-smoke
